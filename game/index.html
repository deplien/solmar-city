<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f14">
<meta name="description" content="Neon Tide: Solmar City — a top-down open-world crime game in pure canvas JavaScript. Steal cars, run Marisol Vega's missions, outrun the Solmar PD.">
<title>Neon Tide: Solmar City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Tide: Solmar City — an open-world crime game. Walk and drive with WASD, aim with the mouse, press E to steal a car, and follow the gold marker to Marisol Vega's missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#f4f1e8;font-family:sans-serif;padding:2rem">Neon Tide: Solmar City needs JavaScript — the whole city is drawn and simulated in it.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
